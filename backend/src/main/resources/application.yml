spring:
  application:
    name: smart-banking
  # Defaults to an in-memory database so the app runs with zero setup.
  # docker-compose points these at MySQL.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bank;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    # Must be at least 32 characters. Always override in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    # An admin user is created on startup if these are set.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  limits:
    max-transaction-amount: 1000000.00

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
